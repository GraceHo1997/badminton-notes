<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>羽球筆記本</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="羽球筆記">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#10b981; --primary-dark:#059669; --primary-light:#d1fae5;
    --accent:#f97316; --win:#059669; --lose:#e11d48;
    --bg:#f4f6f8; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e6eaf0;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.04);
    --shadow-md:0 4px 14px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
    --shadow-lg:0 10px 30px rgba(15,23,42,.10);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Inter","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}

  header{
    background:linear-gradient(135deg,#065f46 0%,#059669 55%,#10b981 100%);
    color:#fff;padding:28px 28px 68px;position:relative;overflow:hidden;
  }
  header::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 85% 0%, rgba(255,255,255,.18), transparent 55%);
    pointer-events:none;
  }
  header .hcontent{position:relative;max-width:1000px;margin:0 auto;}
  header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
  header p{margin:6px 0 0;font-size:13.5px;opacity:.88;font-weight:500;}

  .nav-wrap{max-width:1000px;margin:-42px auto 0;padding:0 20px;position:relative;z-index:2;}
  .toolbar{
    display:flex;gap:8px;justify-content:space-between;align-items:center;
    background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-lg);
    margin-bottom:16px;flex-wrap:wrap;
  }
  .toolbar small.note{color:var(--muted);font-size:12px;font-weight:500;}
  #syncStatus{font-weight:700;}
  #syncStatus.ok{color:var(--primary-dark);}
  #syncStatus.err{color:var(--lose);}
  #syncStatus.pending{color:var(--accent);}

  .tabs{
    display:flex;gap:4px;background:var(--card);border-radius:14px;padding:6px;
    box-shadow:var(--shadow-md);flex-wrap:wrap;
  }
  .tab{
    padding:10px 18px;color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:600;
    border-radius:10px;transition:all .18s ease;flex:1;text-align:center;white-space:nowrap;
  }
  .tab:hover{color:var(--primary-dark);background:#f1f5f4;}
  .tab.active{color:#fff;background:linear-gradient(135deg,var(--primary-dark),var(--primary));box-shadow:0 4px 10px rgba(16,185,129,.35);}

  main{max-width:1000px;margin:0 auto;padding:8px 20px 60px;}
  .panel{display:none;animation:fadeIn .25s ease;}
  .panel.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease;
  }
  .card:hover{box-shadow:var(--shadow-md);}
  .card h2{margin:0 0 14px;font-size:15.5px;font-weight:700;color:var(--text);letter-spacing:-.01em;}
  .card h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--text);}

  textarea{width:100%;min-height:90px;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;resize:vertical;transition:border-color .15s ease;background:#fbfcfd;}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--primary);background:#fff;}
  input[type=text],input[type=date],input[type=number],select{
    border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;background:#fbfcfd;transition:border-color .15s ease;
  }
  button{
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border:none;
    border-radius:10px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;box-shadow:0 2px 6px rgba(16,185,129,.3);
  }
  button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.4);}
  button:active{transform:translateY(0);}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  button.secondary{background:#fff;color:var(--primary-dark);border:1.5px solid var(--primary-light);box-shadow:none;}
  button.secondary:hover{background:var(--primary-light);box-shadow:none;}
  button.danger{background:#fff;color:var(--lose);border:1.5px solid #fecdd3;box-shadow:none;}
  button.danger:hover{background:#fff1f2;box-shadow:none;transform:none;}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:700px){.grid2{grid-template-columns:1fr;} .tab{flex:1 1 40%;}}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  tbody tr{transition:background .12s ease;}
  tbody tr:hover{background:#f8fafc;}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .badge.win{background:#d1fae5;color:var(--win);}
  .badge.lose{background:#ffe4e6;color:var(--lose);}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px;}
  .cal-head{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:4px;}
  .cal-day{
    min-height:68px;border:1.5px solid var(--border);border-radius:12px;padding:8px;font-size:12px;
    cursor:pointer;background:#fbfcfd;position:relative;transition:all .15s ease;
  }
  .cal-day.empty{background:transparent;border:none;cursor:default;}
  .cal-day:not(.empty):hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .cal-day.today{border:2px solid var(--accent);background:#fff7ed;}
  .cal-day .dnum{font-weight:700;color:var(--text);}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px;}
  .dot.session{background:var(--primary);}
  .dot.win{background:var(--win);}
  .dot.lose{background:var(--lose);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;}
  .stat{
    background:linear-gradient(160deg,#f0fdf9,#e6f7f0);border:1px solid var(--primary-light);
    border-radius:14px;padding:16px 12px;text-align:center;
  }
  .stat .icon{font-size:18px;margin-bottom:2px;}
  .stat .num{font-size:26px;font-weight:800;color:var(--primary-dark);letter-spacing:-.02em;}
  .stat .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}

  .skill-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .skill-row label{width:110px;font-size:13px;font-weight:600;flex-shrink:0;}
  .skill-row input[type=range]{flex:1;accent-color:var(--primary);height:6px;}
  .skill-row .val{width:26px;height:26px;border-radius:8px;background:var(--primary-light);color:var(--primary-dark);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}

  .empty-hint{color:var(--muted);font-size:13px;padding:16px 0;text-align:center;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .field input,.field select{width:100%;}
  .chart-box{height:260px;position:relative;}
  canvas{max-width:100%;}
  small.note{color:var(--muted);}
  .loading-overlay{position:fixed;inset:0;background:#f4f6f8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:100;font-size:14px;color:var(--muted);}
  .loading-overlay.hide{display:none;}
  .spinner{width:28px;height:28px;border:3px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .login-screen{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#065f46 0%,#059669 55%,#10b981 100%);z-index:90;padding:20px;
  }
  .login-card{
    background:#fff;border-radius:20px;padding:40px 32px;max-width:360px;width:100%;
    text-align:center;box-shadow:var(--shadow-lg);
  }
  .login-card h1{font-size:24px;margin:0 0 6px;font-weight:800;}
  .login-card p{color:var(--muted);font-size:13.5px;margin:0 0 26px;}
  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    background:#fff;color:#1f1f1f;border:1.5px solid var(--border);border-radius:10px;
    padding:11px 16px;font-size:14px;font-weight:600;box-shadow:none;
  }
  .google-btn:hover{background:#f8fafc;box-shadow:none;transform:none;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;}
  .user-chip .avatar{width:22px;height:22px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div>載入中...</div>
</div>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>🏸 羽球筆記本</h1>
    <p>技巧筆記・練習日曆・對戰紀錄・能力總覽<br>登入後資料會綁定你的帳號，跨裝置同步。</p>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.5-.2-3-.5-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.6 0-14.1 4.3-17.4 10.6z"/><path fill="#4CAF50" d="M24 45.5c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.6 26.9 37.5 24 37.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.8 41 16.4 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C41.4 36.4 44.5 31.3 44.5 25c0-1.5-.2-3-.9-4.5z"/></svg>
      使用 Google 帳號登入
    </button>
  </div>
</div>

<div id="appRoot" style="display:none;">

<header>
  <div class="hcontent">
    <h1>🏸 羽球筆記本</h1>
    <p>技巧筆記・練習日曆・對戰紀錄・能力總覽</p>
  </div>
</header>

<div class="nav-wrap">
  <div class="toolbar">
    <small class="note">資料存在 Supabase 雲端資料庫，任何裝置開這個檔案都會自動同步 — <span id="syncStatus">連接中...</span></small>
    <div class="row" style="gap:8px;">
      <span class="user-chip"><span class="avatar" id="userAvatar">?</span><span id="userEmail"></span></span>
      <button class="secondary" onclick="exportData()">⬇ 額外備份一份</button>
      <button class="secondary" onclick="signOut()">登出</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="notes">📖 技巧筆記</div>
    <div class="tab" data-tab="calendar">📅 練習日曆</div>
    <div class="tab" data-tab="matches">🏆 對戰紀錄</div>
    <div class="tab" data-tab="dashboard">📊 能力總覽</div>
  </div>
</div>

<main>

  <!-- ===== 技巧筆記 ===== -->
  <div class="panel active" id="panel-notes">
    <div class="card">
      <h2>技巧分類筆記</h2>
      <small class="note">編輯後會自動存到雲端資料庫。</small>
    </div>
    <div id="techniqueList"></div>
    <div class="card">
      <h2>新增自訂項目</h2>
      <div class="row">
        <input type="text" id="newTechName" placeholder="例如：假動作、雙打站位..." style="flex:1;min-width:180px;">
        <button onclick="addTechnique()">新增</button>
      </div>
    </div>
  </div>

  <!-- ===== 練習日曆 ===== -->
  <div class="panel" id="panel-calendar">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <button class="secondary" onclick="changeMonth(-1)">‹ 上個月</button>
        <h2 id="calTitle" style="margin:0;"></h2>
        <button class="secondary" onclick="changeMonth(1)">下個月 ›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="row" style="margin-top:12px;font-size:12px;color:var(--muted);">
        <span><span class="dot session"></span>有練習</span>
        <span><span class="dot win"></span>當日有勝場</span>
        <span><span class="dot lose"></span>當日有負場</span>
      </div>
    </div>
    <div class="card" id="dayDetail" style="display:none;"></div>
  </div>

  <!-- ===== 對戰紀錄 ===== -->
  <div class="panel" id="panel-matches">
    <div class="card">
      <h2>新增對戰紀錄</h2>
      <div class="grid2">
        <div class="field"><label>日期</label><input type="date" id="mDate"></div>
        <div class="field"><label>類型</label>
          <select id="mType"><option value="單打">單打</option><option value="雙打">雙打</option></select>
        </div>
        <div class="field"><label>對手</label><input type="text" id="mOpponent" placeholder="對手姓名"></div>
        <div class="field"><label>局數比分（用逗號分隔，例如 21-15,19-21,21-18）</label><input type="text" id="mScore" placeholder="21-15,21-18"></div>
      </div>
      <div class="field"><label>備註</label><input type="text" id="mNote" placeholder="戰術、失誤、心得..." style="width:100%;"></div>
      <button id="addMatchBtn" onclick="addMatch()">新增對戰</button>
    </div>
    <div class="card">
      <h2>對戰紀錄列表</h2>
      <table>
        <thead><tr><th>日期</th><th>類型</th><th>對手</th><th>比分</th><th>結果</th><th>備註</th><th></th></tr></thead>
        <tbody id="matchTableBody"></tbody>
      </table>
      <div id="matchEmptyHint" class="empty-hint">尚無對戰紀錄</div>
    </div>
  </div>

  <!-- ===== 能力總覽 ===== -->
  <div class="panel" id="panel-dashboard">
    <div class="card">
      <h2>整體戰績</h2>
      <div class="stat-grid" id="statGrid"></div>
    </div>
    <div class="grid2">
      <div class="card">
        <h2>自評能力雷達圖</h2>
        <div class="chart-box"><canvas id="radarChart"></canvas></div>
      </div>
      <div class="card">
        <h2>每月練習次數</h2>
        <div class="chart-box"><canvas id="practiceChart"></canvas></div>
      </div>
    </div>
    <div class="card">
      <h2>調整自評分數（1-5）</h2>
      <div id="skillSliders"></div>
    </div>
  </div>

</main>

</div><!-- /appRoot -->

<script>
/* ---------------- Supabase setup ---------------- */
const SUPABASE_URL = 'https://ivuanvdxduyvqymdofuj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2dWFudmR4ZHV5dnF5bWRvZnVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTY1MjYsImV4cCI6MjEwMDgzMjUyNn0.3PHdRpihUuuc1Q-61X1d-vl6FpQdyRvDtrTNN2rak7Q';
const SITE_URL = 'https://graceho1997.github.io/badminton-notes/';
let sb = null;
let currentUser = null;

function signInWithGoogle(){
  sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: SITE_URL } });
}
function signOut(){
  sb.auth.signOut().then(()=>{ window.location.href = SITE_URL; });
}

function setSyncStatus(state, msg){
  const el = document.getElementById('syncStatus');
  el.className = state;
  el.innerText = msg;
}

/* ---------------- Data model ---------------- */
const defaultTechniques = [
  {key:"serve", icon:"🎯", name:"發球（短球／長球）", text:"短發球：貼網低平，重心壓低；長發球：多用於雙打偷襲後場。"},
  {key:"clear", icon:"🌤️", name:"高遠球 Clear", text:"擊球點在身體前上方，手臂高點發力，把對手壓到底線。"},
  {key:"smash", icon:"⚡", name:"殺球 Smash", text:"轉髖轉肩帶動手臂，擊球點盡量在最高點，角度往下壓。"},
  {key:"drop", icon:"🪶", name:"切球 / 點扣 Drop", text:"假動作要像殺球，最後手腕放鬆切球過網，貼近網前。"},
  {key:"drive", icon:"↔️", name:"平抽球 Drive", text:"雙打中場對抽，手腕快速出手，減少揮拍幅度。"},
  {key:"net", icon:"🕸️", name:"網前小球 Net Shot", text:"輕觸球，弧線低而貼網，重心要穩、腳步先到位。"},
  {key:"lob", icon:"🚀", name:"挑球 Lob", text:"從網前把球挑高到底線，防守轉換用，注意不要挑太短。"},
  {key:"footwork", icon:"👟", name:"步法 Footwork", text:"六角形步法練習，回中央位置，起跳與墊步節奏。"},
  {key:"strategy", icon:"🧠", name:"戰術 / 比賽策略", text:"觀察對手弱點、控制節奏、關鍵分心理調整。"}
];
const defaultSkillKeys = ['serve','clear','smash','drop','drive','net','lob','footwork','strategy','stamina'];

let appData = {
  techniques: [],
  sessions: [],
  matches: [],
  skillRatings: {}
};

let calYear, calMonth; // 0-indexed month

/* ---------------- Load everything from Supabase ---------------- */
async function loadAll(){
  // techniques
  let { data: techs, error: techErr } = await sb.from('techniques').select('*').order('sort_order', {ascending:true});
  if(techErr) throw techErr;
  if(!techs || techs.length===0){
    const seed = defaultTechniques.map((t,i)=>({id:t.key, icon:t.icon, name:t.name, content:t.text, is_custom:false, sort_order:i, user_id:currentUser.id}));
    const { error: seedErr } = await sb.from('techniques').insert(seed);
    if(seedErr) throw seedErr;
    techs = seed;
  }
  appData.techniques = techs.map(t=>({key:t.id, icon:t.icon, name:t.name, text:t.content||'', custom:t.is_custom}));

  // sessions
  let { data: sess, error: sessErr } = await sb.from('sessions').select('*');
  if(sessErr) throw sessErr;
  appData.sessions = (sess||[]).map(s=>({date:s.date, note:s.note||''}));

  // matches
  let { data: ms, error: msErr } = await sb.from('matches').select('*').order('match_date', {ascending:false});
  if(msErr) throw msErr;
  appData.matches = (ms||[]).map(m=>({id:m.id, date:m.match_date, type:m.type, opponent:m.opponent, score:m.score, win:m.is_win, note:m.note||''}));

  // skill ratings
  let { data: sk, error: skErr } = await sb.from('skill_ratings').select('*');
  if(skErr) throw skErr;
  if(!sk || sk.length===0){
    const seedSkills = defaultSkillKeys.map(k=>({skill_key:k, value:3, user_id:currentUser.id}));
    const { error: seedSkErr } = await sb.from('skill_ratings').insert(seedSkills);
    if(seedSkErr) throw seedSkErr;
    sk = seedSkills;
  }
  appData.skillRatings = {};
  defaultSkillKeys.forEach(k=>appData.skillRatings[k]=3);
  sk.forEach(s=>{ appData.skillRatings[s.skill_key] = s.value; });
}

/* ---------------- Init ---------------- */
let appInitialized = false;

function showLoadError(msg){
  setSyncStatus('err','⚠ 連線失敗');
  document.getElementById('loadingOverlay').classList.remove('hide');
  document.getElementById('loadingOverlay').innerHTML = '<div style="max-width:360px;text-align:center;color:#e11d48;font-weight:600;">連接 Supabase 失敗<br><span style="font-weight:400;color:#64748b;font-size:12.5px;display:block;margin-top:8px;">'+msg+'</span></div>';
}

function onSignedOut(){
  document.getElementById('loadingOverlay').classList.add('hide');
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

async function onSignedIn(user){
  if(appInitialized) return; // avoid double init on repeated auth events
  appInitialized = true;
  currentUser = user;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  const email = user.email || '';
  document.getElementById('userEmail').innerText = email;
  document.getElementById('userAvatar').innerText = (email[0]||'?').toUpperCase();

  const today = new Date();
  calYear = today.getFullYear();
  calMonth = today.getMonth();
  document.getElementById('mDate').value = today.toISOString().slice(0,10);

  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('panel-'+t.dataset.tab).classList.add('active');
      if(t.dataset.tab==='dashboard') renderDashboard();
    });
  });

  try{
    document.getElementById('loadingOverlay').classList.remove('hide');
    setSyncStatus('pending','連接中...');
    await loadAll();
    setSyncStatus('ok','☁ 已連接');
    renderTechniques();
    renderCalendar();
    renderMatches();
    document.getElementById('loadingOverlay').classList.add('hide');
  }catch(err){
    console.error(err);
    const msg = (err && err.message) ? err.message : String(err);
    showLoadError(msg);
    appInitialized = false;
  }
}

window.addEventListener('DOMContentLoaded', async function(){
  if(typeof supabase === 'undefined'){
    showLoadError('Supabase JS SDK 沒有載入成功（CDN 讀不到，可能是網路問題），請檢查網路連線後重新整理頁面。');
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  sb.auth.onAuthStateChange((event, session) => {
    if(session && session.user){ onSignedIn(session.user); }
    else if(event === 'SIGNED_OUT'){ onSignedOut(); appInitialized = false; }
  });

  const { data, error } = await sb.auth.getSession();
  if(error){ showLoadError(error.message); return; }
  if(data && data.session && data.session.user){
    onSignedIn(data.session.user);
  } else {
    onSignedOut();
  }
});

/* ---------------- Techniques ---------------- */
function renderTechniques(){
  const list = document.getElementById('techniqueList');
  list.innerHTML = '';
  appData.techniques.forEach((tech, idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${tech.icon||'🏸'} ${tech.name} ${tech.custom ? '<button class="danger" style="float:right;padding:2px 8px;" onclick="removeTechnique('+idx+')">刪除</button>' : ''}</h3>
      <textarea onchange="updateTechnique(${idx}, this.value)">${tech.text || ''}</textarea>
    `;
    list.appendChild(card);
  });
}
async function updateTechnique(idx, val){
  appData.techniques[idx].text = val;
  setSyncStatus('pending','儲存中...');
  const { error } = await sb.from('techniques').update({content: val}).eq('id', appData.techniques[idx].key);
  setSyncStatus(error?'err':'ok', error?'⚠ 儲存失敗':'☁ 已同步');
}
async function addTechnique(){
  const nameInput = document.getElementById('newTechName');
  const name = nameInput.value.trim();
  if(!name) return;
  const key = 'custom_' + Date.now();
  const row = {id:key, icon:'✨', name, content:'', is_custom:true, sort_order: appData.techniques.length, user_id:currentUser.id};
  setSyncStatus('pending','儲存中...');
  const { error } = await sb.from('techniques').insert(row);
  if(error){ setSyncStatus('err','⚠ 新增失敗'); alert('新增失敗：'+error.message); return; }
  appData.techniques.push({key, icon:'✨', name, text:'', custom:true});
  nameInput.value='';
  renderTechniques();
  setSyncStatus('ok','☁ 已同步');
}
async function removeTechnique(idx){
  const key = appData.techniques[idx].key;
  setSyncStatus('pending','刪除中...');
  const { error } = await sb.from('techniques').delete().eq('id', key);
  if(error){ setSyncStatus('err','⚠ 刪除失敗'); alert('刪除失敗：'+error.message); return; }
  appData.techniques.splice(idx,1);
  renderTechniques();
  setSyncStatus('ok','☁ 已同步');
}

/* ---------------- Calendar ---------------- */
function changeMonth(delta){
  calMonth += delta;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
  document.getElementById('dayDetail').style.display='none';
}
function fmtDate(y,m,d){
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function renderCalendar(){
  document.getElementById('calTitle').innerText = `${calYear} 年 ${calMonth+1} 月`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['日','一','二','三','四','五','六'].forEach(d=>{
    const h = document.createElement('div');
    h.className='cal-head'; h.innerText=d;
    grid.appendChild(h);
  });
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  for(let i=0;i<firstDay;i++){
    const e = document.createElement('div');
    e.className='cal-day empty';
    grid.appendChild(e);
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = fmtDate(calYear, calMonth, d);
    const cell = document.createElement('div');
    cell.className='cal-day' + (dateStr===todayStr ? ' today':'');
    const hasSession = appData.sessions.some(s=>s.date===dateStr);
    const dayMatches = appData.matches.filter(m=>m.date===dateStr);
    const hasWin = dayMatches.some(m=>m.win);
    const hasLose = dayMatches.some(m=>!m.win);
    let dots = '';
    if(hasSession) dots += '<span class="dot session"></span>';
    if(hasWin) dots += '<span class="dot win"></span>';
    if(hasLose) dots += '<span class="dot lose"></span>';
    cell.innerHTML = `<div class="dnum">${d}</div><div>${dots}</div>`;
    cell.onclick = ()=>showDayDetail(dateStr);
    grid.appendChild(cell);
  }
}
function showDayDetail(dateStr){
  const box = document.getElementById('dayDetail');
  box.style.display='block';
  const session = appData.sessions.find(s=>s.date===dateStr);
  const dayMatches = appData.matches.filter(m=>m.date===dateStr);
  let matchHtml = dayMatches.length ? dayMatches.map(m=>`
    <div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border);padding:6px 0;">
      <span>${m.type} vs ${m.opponent} — ${m.score} <span class="badge ${m.win?'win':'lose'}">${m.win?'勝':'負'}</span></span>
    </div>`).join('') : '<div class="empty-hint">當天無對戰紀錄</div>';

  box.innerHTML = `
    <h2>${dateStr} 紀錄</h2>
    <div class="field">
      <label>練習備註（有填寫代表當天有去打球）</label>
      <textarea id="sessionNote" placeholder="練習內容、場地、心得...">${session ? session.note : ''}</textarea>
    </div>
    <div class="row">
      <button onclick="saveSession('${dateStr}')">儲存練習紀錄</button>
      ${session ? `<button class="danger" onclick="deleteSession('${dateStr}')">刪除練習紀錄</button>` : ''}
      <button class="secondary" onclick="document.getElementById('mDate').value='${dateStr}'; document.querySelector('.tab[data-tab=matches]').click();">在此日新增對戰</button>
    </div>
    <h3 style="margin-top:14px;">當天對戰</h3>
    ${matchHtml}
  `;
}
async function saveSession(dateStr){
  const note = document.getElementById('sessionNote').value;
  setSyncStatus('pending','儲存中...');
  const { error } = await sb.from('sessions').upsert({date:dateStr, note, user_id:currentUser.id}, {onConflict:'user_id,date'});
  if(error){ setSyncStatus('err','⚠ 儲存失敗'); alert('儲存失敗：'+error.message); return; }
  const existing = appData.sessions.find(s=>s.date===dateStr);
  if(existing){ existing.note = note; }
  else { appData.sessions.push({date:dateStr, note}); }
  renderCalendar();
  showDayDetail(dateStr);
  setSyncStatus('ok','☁ 已同步');
}
async function deleteSession(dateStr){
  setSyncStatus('pending','刪除中...');
  const { error } = await sb.from('sessions').delete().eq('date', dateStr);
  if(error){ setSyncStatus('err','⚠ 刪除失敗'); alert('刪除失敗：'+error.message); return; }
  appData.sessions = appData.sessions.filter(s=>s.date!==dateStr);
  renderCalendar();
  showDayDetail(dateStr);
  setSyncStatus('ok','☁ 已同步');
}

/* ---------------- Matches ---------------- */
function computeWin(scoreStr){
  const games = scoreStr.split(',').map(g=>g.trim()).filter(Boolean);
  let myWins=0, oppWins=0;
  games.forEach(g=>{
    const parts = g.split('-').map(x=>parseInt(x.trim(),10));
    if(parts.length===2 && !isNaN(parts[0]) && !isNaN(parts[1])){
      if(parts[0]>parts[1]) myWins++; else if(parts[1]>parts[0]) oppWins++;
    }
  });
  return myWins > oppWins;
}
async function addMatch(){
  const date = document.getElementById('mDate').value;
  const type = document.getElementById('mType').value;
  const opponent = document.getElementById('mOpponent').value.trim();
  const score = document.getElementById('mScore').value.trim();
  const note = document.getElementById('mNote').value.trim();
  if(!date || !opponent || !score){ alert('請填寫日期、對手、比分'); return; }
  const win = computeWin(score);
  const btn = document.getElementById('addMatchBtn');
  btn.disabled = true;
  setSyncStatus('pending','儲存中...');
  const { data, error } = await sb.from('matches')
    .insert({match_date:date, type, opponent, score, is_win:win, note, user_id:currentUser.id})
    .select()
    .single();
  btn.disabled = false;
  if(error){ setSyncStatus('err','⚠ 新增失敗'); alert('新增失敗：'+error.message); return; }
  appData.matches.push({id:data.id, date, type, opponent, score, win, note});
  document.getElementById('mOpponent').value='';
  document.getElementById('mScore').value='';
  document.getElementById('mNote').value='';
  renderMatches();
  renderCalendar();
  setSyncStatus('ok','☁ 已同步');
}
async function deleteMatch(id){
  setSyncStatus('pending','刪除中...');
  const { error } = await sb.from('matches').delete().eq('id', id);
  if(error){ setSyncStatus('err','⚠ 刪除失敗'); alert('刪除失敗：'+error.message); return; }
  appData.matches = appData.matches.filter(m=>m.id!==id);
  renderMatches();
  renderCalendar();
  setSyncStatus('ok','☁ 已同步');
}
function renderMatches(){
  const tbody = document.getElementById('matchTableBody');
  tbody.innerHTML='';
  const sorted = [...appData.matches].sort((a,b)=> b.date.localeCompare(a.date));
  sorted.forEach(m=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${m.date}</td><td>${m.type}</td><td>${m.opponent}</td><td>${m.score}</td>
      <td><span class="badge ${m.win?'win':'lose'}">${m.win?'勝':'負'}</span></td>
      <td>${m.note||''}</td>
      <td><button class="danger" style="padding:2px 8px;" onclick="deleteMatch(${m.id})">刪除</button></td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('matchEmptyHint').style.display = sorted.length ? 'none' : 'block';
}

/* ---------------- Dashboard ---------------- */
let radarChartObj=null, practiceChartObj=null;
function renderDashboard(){
  const total = appData.matches.length;
  const wins = appData.matches.filter(m=>m.win).length;
  const losses = total - wins;
  const winRate = total ? Math.round(wins/total*100) : 0;
  const sessionCount = appData.sessions.length;

  document.getElementById('statGrid').innerHTML = `
    <div class="stat"><div class="icon">🏸</div><div class="num">${total}</div><div class="lbl">總場次</div></div>
    <div class="stat"><div class="icon">✅</div><div class="num">${wins}</div><div class="lbl">勝場</div></div>
    <div class="stat"><div class="icon">❌</div><div class="num">${losses}</div><div class="lbl">敗場</div></div>
    <div class="stat"><div class="icon">🔥</div><div class="num">${winRate}%</div><div class="lbl">勝率</div></div>
    <div class="stat"><div class="icon">📅</div><div class="num">${sessionCount}</div><div class="lbl">練習天數</div></div>
  `;

  const skillNames = {serve:'發球',clear:'高遠球',smash:'殺球',drop:'切球',drive:'平抽球',net:'網前小球',lob:'挑球',footwork:'步法',strategy:'戰術',stamina:'體力'};
  const sliderBox = document.getElementById('skillSliders');
  sliderBox.innerHTML = Object.keys(appData.skillRatings).map(k=>`
    <div class="skill-row">
      <label>${skillNames[k]||k}</label>
      <input type="range" min="1" max="5" step="1" value="${appData.skillRatings[k]}" oninput="updateSkill('${k}', this.value)">
      <div class="val" id="val-${k}">${appData.skillRatings[k]}</div>
    </div>
  `).join('');

  const ctx1 = document.getElementById('radarChart').getContext('2d');
  const labels = Object.keys(appData.skillRatings).map(k=>skillNames[k]||k);
  const data = Object.values(appData.skillRatings);
  if(radarChartObj) radarChartObj.destroy();
  radarChartObj = new Chart(ctx1, {
    type:'radar',
    data:{labels, datasets:[{label:'自評能力', data, backgroundColor:'rgba(16,185,129,.2)', borderColor:'#059669', pointBackgroundColor:'#059669'}]},
    options:{responsive:true, maintainAspectRatio:false, scales:{r:{min:0,max:5,ticks:{stepSize:1}}}, plugins:{legend:{display:false}}}
  });

  const monthCounts = {};
  appData.sessions.forEach(s=>{
    const ym = s.date.slice(0,7);
    monthCounts[ym] = (monthCounts[ym]||0)+1;
  });
  const months = Object.keys(monthCounts).sort();
  const ctx2 = document.getElementById('practiceChart').getContext('2d');
  if(practiceChartObj) practiceChartObj.destroy();
  practiceChartObj = new Chart(ctx2, {
    type:'bar',
    data:{labels: months, datasets:[{label:'練習次數', data: months.map(m=>monthCounts[m]), backgroundColor:'#059669'}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{stepSize:1}}}}
  });
}
async function updateSkill(key, val){
  const value = parseInt(val,10);
  appData.skillRatings[key] = value;
  document.getElementById('val-'+key).innerText = val;
  renderDashboard();
  setSyncStatus('pending','儲存中...');
  const { error } = await sb.from('skill_ratings').upsert({skill_key:key, value, user_id:currentUser.id}, {onConflict:'user_id,skill_key'});
  setSyncStatus(error?'err':'ok', error?'⚠ 儲存失敗':'☁ 已同步');
}

/* ---------------- Export (optional manual backup) ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(appData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `羽球筆記備份_${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
